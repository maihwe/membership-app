version: '3.8'

services:
  # Main Flask application
  web:
    build: .
    container_name: membership-app
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_APP: run.py
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///membership.db}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ORG_NAME: ${ORG_NAME:-Membership Organization}
      ORG_EMAIL: ${ORG_EMAIL:-noreply@membership.local}
    volumes:
      - ./membership.db:/app/membership.db
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - membership-network
    depends_on:
      - db

  # Optional: PostgreSQL database (for production)
  # Uncomment to use PostgreSQL instead of SQLite
  # db:
  #   image: postgres:15-alpine
  #   container_name: membership-db
  #   environment:
  #     POSTGRES_DB: membership
  #     POSTGRES_USER: ${DB_USER:-membership}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - membership-network
  #   restart: unless-stopped

  # Placeholder for DB service (required by depends_on)
  db:
    image: alpine:latest
    command: "true"
    networks:
      - membership-network

  # Optional: Nginx reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: membership-proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - web
  #   networks:
  #     - membership-network
  #   restart: unless-stopped

networks:
  membership-network:
    driver: bridge

volumes:
  postgres_data:
