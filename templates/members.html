{% extends "base.html" %}

{% block title %}Members - Membership App{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Members</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMemberModal" id="addMemberBtn" style="display: none;">
        <i class="bi bi-plus"></i> Add Member
    </button>
</div>

<!-- Members List -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Total Contributed</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="membersList">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Loading members...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Member Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Member</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="form-group mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="newMemberEmail" placeholder="member@example.com">
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="newMemberPhone" placeholder="+234-XXX-XXXX-XXXX">
                </div>
                <div class="form-group mb-3">
                    <label class="form-label">Bio (Optional)</label>
                    <textarea class="form-control" id="newMemberBio" rows="3" placeholder="Tell us about this member..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addMember()">Add Member</button>
            </div>
        </div>
    </div>
</div>

<!-- Member Details Modal -->
<div class="modal fade" id="memberDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="memberDetailsTitle">Member Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="memberDetailsBody">
                Loading...
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="editMemberBtn" style="display: none;">Edit Member</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadMembers();
        
        // Show add member button if admin
        if (currentUser && ['super_admin', 'admin'].includes(currentUser.role)) {
            document.getElementById('addMemberBtn').style.display = 'inline-block';
        }
    });

    async function loadMembers() {
        try {
            const { status, data } = await apiCall('GET', '/members');
            
            if (status !== 200) {
                document.getElementById('membersList').innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger">Failed to load members</td>
                    </tr>
                `;
                return;
            }
            
            const html = data.members.map(m => `
                <tr>
                    <td><strong>${escapeHtml(m.email)}</strong></td>
                    <td>${escapeHtml(m.phone || '-')}</td>
                    <td>
                        <span class="badge bg-${m.status === 'active' ? 'success' : 'secondary'}">
                            ${m.status}
                        </span>
                    </td>
                    <td>${new Date(m.joined_date).toLocaleDateString()}</td>
                    <td>${formatCurrency(m.total_contributed || 0)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="viewMemberDetails('${m.id}')">
                            View
                        </button>
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('membersList').innerHTML = html || `
                <tr>
                    <td colspan="6" class="text-center text-muted">No members found</td>
                </tr>
            `;
            
        } catch (e) {
            console.error('Error loading members:', e);
        }
    }

    async function viewMemberDetails(memberId) {
        try {
            const { status, data } = await apiCall('GET', `/members/${memberId}`);
            
            if (status !== 200) {
                alert('Failed to load member details');
                return;
            }
            
            document.getElementById('memberDetailsTitle').textContent = data.email;
            document.getElementById('memberDetailsBody').innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Email:</strong> ${escapeHtml(data.email)}</p>
                        <p><strong>Phone:</strong> ${escapeHtml(data.phone || 'Not provided')}</p>
                        <p><strong>Status:</strong> <span class="badge bg-${data.status === 'active' ? 'success' : 'secondary'}">${data.status}</span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Joined:</strong> ${new Date(data.joined_date).toLocaleDateString()}</p>
                        <p><strong>Bio:</strong> ${escapeHtml(data.bio || 'No bio provided')}</p>
                    </div>
                </div>
            `;
            
            new bootstrap.Modal(document.getElementById('memberDetailsModal')).show();
            
        } catch (e) {
            console.error('Error loading member details:', e);
        }
    }

    async function addMember() {
        const email = document.getElementById('newMemberEmail').value.trim().toLowerCase();
        const phone = document.getElementById('newMemberPhone').value.trim();
        const bio = document.getElementById('newMemberBio').value.trim();
        
        if (!email) {
            alert('Email is required');
            return;
        }
        
        try {
            const { status, data } = await apiCall('POST', '/members', {
                email: email,
                phone: phone,
                bio: bio
            });
            
            if (status === 201) {
                alert('Member added successfully!');
                bootstrap.Modal.getInstance(document.getElementById('addMemberModal')).hide();
                document.getElementById('newMemberEmail').value = '';
                document.getElementById('newMemberPhone').value = '';
                document.getElementById('newMemberBio').value = '';
                loadMembers();
            } else {
                alert('Error: ' + data.error);
            }
        } catch (e) {
            console.error('Error adding member:', e);
            alert('Failed to add member');
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('en-NG', {
            style: 'currency',
            currency: 'NGN',
            minimumFractionDigits: 0
        }).format(value);
    }
</script>
{% endblock %}
